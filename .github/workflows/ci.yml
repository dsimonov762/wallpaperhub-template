# Pull requests and pushes to `master`. Language-agnostic: whichever services/<service>/<impl>/Dockerfile exists is built and
# held to docs/SERVICE-SPEC.md by the conformance suite (service.yml); with no implementation yet only the contract,
# gateway and suite jobs run. Add a branch protection rule that requires the single check "ci / ok".
# Actions are pinned to a major version; let Dependabot or Renovate bump them.
name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: contracts and static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: scripts/validate/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/contract-tools/package-lock.json
      # The hooks of .pre-commit-config.yaml (file hygiene, shellcheck, actionlint, hadolint). The wh-* hooks run make targets that the steps below
      # already run one by one, so they are skipped here: the list comes from the config, a new wh-* hook needs no edit of this file.
      - name: Pre-commit hooks on every file
        run: |
          pip install -q pre-commit==4.7.0
          SKIP="$(grep -oE '^ *- id: wh-[a-z-]+' .pre-commit-config.yaml | sed 's/.*id: //' | paste -sd, -)" pre-commit run --all-files --show-diff-on-failure --color always
      - name: Install Hurl (hurlfmt checks the formatting of the .hurl files)
        run: scripts/ci/install-hurl.sh
      - name: Hurl needs libxml2.so.2 (Ubuntu 26.04 only ships libxml2.so.16)
        run: |
          lib="/usr/lib/$(uname -m)-linux-gnu"
          if ! ldconfig -p | grep -q 'libxml2\.so\.2 '; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libxml2-16
            sudo ln -sf "$lib/libxml2.so.16" "$lib/libxml2.so.2"
            sudo ldconfig
          fi
          hurl --version
      - run: make env
      - name: compose files, shell syntax, Hurl formatting, generated gateway errors
        run: make lint
      - name: OpenAPI, GraphQL, Avro, proto, i18n and the gateway config agree with each other and the README
        run: make check-contracts
      - name: Spectral, buf, Avro and GraphQL conventions
        run: make contracts-lint
        env:
          CONTRACT_TOOLS: native
      - name: Seed data is up to date and valid against the DB schemas
        run: make seed-check
      - name: Bruno collection is up to date with the contracts and the seed data
        run: make bruno-check
      - name: Grafana dashboards are valid (structure, datasources, PromQL)
        run: make dashboards-check
      - name: Failure-injection config is up to date and fits the compose file and the scenarios
        run: make chaos-check
      - name: The load-test gateway config can still be derived from envoy.yaml
        run: make load-check
      - name: The HTTPS gateway config can still be derived from envoy.yaml
        run: make https-check
      - name: Renovate configuration is valid
        run: make renovate-check
      - name: Architecture decision records are well formed, linked and indexed
        run: make adr-check adr-selftest

  seed:
    name: seed data loads into Postgres
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.7-trixie
        env:
          POSTGRES_PASSWORD: seedtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Canonical schema, then the seed SQL twice (constraints hold, the second load changes nothing)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: seedtest
        run: scripts/ci/seed-sql-test.sh

  breaking:
    name: breaking contract changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
          cache: pip
          cache-dependency-path: scripts/validate/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/contract-tools/package-lock.json
      - name: Compare contracts/ with the point where this branch left ${{ github.base_ref }}
        env:
          BASE_REF: ${{ github.base_ref }}
          CONTRACT_TOOLS: native
        run: make contracts-breaking BASE="$(git merge-base "origin/$BASE_REF" HEAD)"

  gateway:
    name: gateway (mocks) and conformance suite (reference stub)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
      - name: Install Hurl
        run: scripts/ci/install-hurl.sh
      - name: Hurl needs libxml2.so.2 (Ubuntu 26.04 only ships libxml2.so.16)
        run: |
          lib="/usr/lib/$(uname -m)-linux-gnu"
          if ! ldconfig -p | grep -q 'libxml2\.so\.2 '; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libxml2-16
            sudo ln -sf "$lib/libxml2.so.16" "$lib/libxml2.so.2"
            sudo ldconfig
          fi
          hurl --version
      # A native k6 makes scripts/k6.sh talk to the gateway on localhost. Without it the script falls back to the
      # grafana/k6 container, which reaches the host through the docker0 bridge, and the gateway only listens on 127.0.0.1.
      # Keep the version in step with K6_IMAGE in scripts/k6.sh.
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
        with:
          k6-version: "2.4.0"
      - run: make env
      - name: Gateway, Keycloak, Redis and the four Prism mocks (about 2 GB)
        run: make up-mocks
      - name: Gateway checks (health, problem+json, CORS, token routing, rate limit, localization)
        run: make e2e
      - name: k6 smoke test (every journey once through the gateway; the mocks serve no GraphQL)
        run: make load-run P=smoke SKIP=graphql
      - name: The conformance suite passes the reference stub and catches deliberately broken ones
        run: make conformance-selftest
      - name: Collect logs
        if: failure()
        run: scripts/ci/collect-logs.sh ci-logs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gateway-reports
          path: |
            e2e/.run/*.xml
            conformance/.run/
            ci-logs/
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Stop
        if: always()
        run: make down

  detect:
    name: find service implementations
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=""
          [ -n "$BASE_REF" ] && base="$(git merge-base "origin/$BASE_REF" HEAD)"
          scripts/ci/detect-services.sh "$base"

  services:
    name: ${{ matrix.service }} ${{ matrix.dir }}
    needs: [detect, static]
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/service.yml
    with:
      service: ${{ matrix.service }}
      dir: ${{ matrix.dir }}

  ok:
    name: ok
    if: always()
    needs: [static, seed, breaking, gateway, detect, services]
    runs-on: ubuntu-26.04
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
