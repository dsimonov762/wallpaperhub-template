name: Work package
description: Take or propose a piece of work from docs/ROADMAP.md (a service, a tool, a document).
title: "WP-"
labels: ["work-package"]
body:
  - type: input
    id: wp
    attributes:
      label: Package
      description: The id in docs/ROADMAP.md (S1, T1, X1 ...), or "new" for something that is not there yet.
      placeholder: S1
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and lane
      description: What will exist when it is done, and which folders and shared files you will change (the lane of the package).
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Copy the checklist of the package and the common one from docs/ROADMAP.md; add what is specific.
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: Decisions that you need from the owner (they go to docs/STATUS.md as well).
    validations:
      required: false
