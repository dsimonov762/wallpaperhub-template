# Wallpaper Hub seed dataset: the single source of truth for `make seed`.
# `python seed/build.py` turns it into seed/out/ (SQL, Mongo, Elasticsearch, Redis, Keycloak, images). The generated files
# are committed, so `make seed` needs nothing but the images the stack already pulled. Edit this file, run
# `make seed-build`, commit both. Ids of every store are derived from the keys below (deterministic, see seed/CATALOG.md).
#
# Conventions: dates are fixed (anchor minus N days) so the output is stable and diff-able; change `anchor` to move
# everything. Passwords of all seeded users are `password` (like alice, mod and admin of the realm export).

anchor: "2026-11-01T09:00:00Z"

# ----------------------------------------------------------------------------------------------------------------------
# Users. The first three exist in infra/keycloak/realm-export.json with the same UUIDs; the others are created in Keycloak
# by the seed job (Admin API partial import) with the UUIDs below, so token `sub` == users.id == wallpapers.author.id.
# status SUSPENDED also disables the Keycloak user. `deleted: N` = soft-deleted N days before the anchor (no Keycloak user,
# no wallpapers, no notifications: the purge job removes the row 30 days after deletion).
users:
  alice: {n: 1,  name: "Alice Example",   locale: en, joined: 120, avatar: true,  banner: true,  roles: [USER],      bio: "Landscape and space wallpapers. Most of my work is procedural, a few layers and a lot of fog." }
  mod:   {n: 2,  name: "Mona Moderator",  locale: de, joined: 200, avatar: true,  roles: [MODERATOR], bio: "Ich prüfe neue Wallpaper und halte den Katalog sauber." }
  admin: {n: 3,  name: "Adam Admin",      locale: es, joined: 300, avatar: false, roles: [ADMIN],     bio: "Administración de Wallpaper Hub." }
  bob:   {n: 4,  name: "Bob Builder",     locale: en, joined: 90,  avatar: true,  roles: [USER],      bio: "Desk setups, neon and city lights." }
  carol: {n: 5,  name: "Carola Schmidt",  locale: de, joined: 75,  avatar: true,  banner: true, roles: [USER], bio: "Herbst, Nebel und Eulen. Wallpaper aus Berlin." }
  dave:  {n: 6,  name: "Dave Lopez",      locale: en, joined: 60,  avatar: true,  roles: [USER],      bio: "Learning generative art. Not every upload makes it through moderation." }
  erin:  {n: 7,  name: "Erín Castillo",   locale: es, joined: 45,  avatar: true,  roles: [USER],      bio: "Desierto, estrellas y mucho minimalismo." }
  frank: {n: 8,  name: "Frank Weber",     locale: en, joined: 40,  avatar: false, roles: [USER],      status: SUSPENDED, bio: "Suspended account: its published wallpaper stays visible, new uploads are blocked." }
  grace: {n: 9,  name: "Grace Müller",    locale: de, joined: 30,  avatar: true,  roles: [USER],      bio: "Meer, Beton, Stille." }
  heidi: {n: 10, name: "Heidi Novak",     locale: en, joined: 20,  avatar: true,  roles: [USER],      bio: "Circuit boards and coastlines." }
  ivan:  {n: 11, name: "Ivan Petrov",     locale: es, joined: 150, avatar: false, roles: [USER],      deleted: 20, bio: null }
  judy:  {n: 12, name: "Judy Newcomer",   locale: en, joined: 1,   avatar: false, roles: [USER],      bio: null }

# Notification preferences that differ from the defaults (absent prefs:{user} key = defaults, README 6.5)
prefs:
  bob:   {locale: en, email: 0, inApp: 1, digest: 1, version: 1}
  carol: {locale: de, email: 1, inApp: 1, digest: 0, version: 2}

# ----------------------------------------------------------------------------------------------------------------------
# Wallpapers. m = motif of the generated picture (hills waves blobs stars city grid minimal critter), p = three colours
# (top, bottom, accent), size = full variant, ago = days before the anchor, pop 1..5 drives views/downloads.
# status: PUBLISHED (default) | PENDING_MEDIA (asset still PROCESSING) | REJECTED | REMOVED
# `mod` = moderation decision {d: APPROVED|REJECTED|REMOVED, reason, ago}; `asset_reject` = the media pipeline rejected it.
wallpapers:
  w01: {a: alice, t: "Misty Pines",              c: NATURE,       m: hills,   p: ["#9fb4c7","#2e4a3b","#e8eef2"], size: [2560,1440], ago: 40, pop: 5, tags: [forest, fog, pine, mountains], d: "Rows of pines fading into morning fog. Cool greens, soft light." }
