          $ref: '#/components/schemas/Tags'
        category:
          $ref: '#/components/schemas/WallpaperCategory'
    ReplaceWallpaperRequest:
      type: object
      required: [title, category]
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/Title'
        description:
          $ref: '#/components/schemas/Description'
        tags:
          $ref: '#/components/schemas/Tags'
        category:
          $ref: '#/components/schemas/WallpaperCategory'
    PatchWallpaperRequest:
      type: object
      description: At least one field is required.
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          $ref: '#/components/schemas/Title'
        description:
          $ref: '#/components/schemas/Description'
        tags:
          $ref: '#/components/schemas/Tags'
        category:
          $ref: '#/components/schemas/WallpaperCategory'
