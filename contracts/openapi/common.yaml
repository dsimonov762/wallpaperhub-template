openapi: 3.0.3
info:
  title: Wallpaper Hub - shared components
  version: 1.0.0
  description: |
    Building blocks that the four service specs reference with `$ref: 'common.yaml#/components/...'`:
    the conventions of README 5.2, the problem+json error model of README 5.3, resource ids, and the
    parameters, headers and error responses every service shares. This file defines no API of its own.
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak access token of realm `wallpaperhub`. End users get one with authorization code + PKCE
        (client `web-spa`); services use client credentials. Token endpoint of the local stack:
        `http://localhost:8180/realms/wallpaperhub/protocol/openid-connect/token`.
        The gateway only pre-checks signature, issuer and expiry; every service validates the token again
        and applies roles and ownership (README 7).

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Language of error messages and other human-readable text: `en`, `de` or `es`. Quality values and
        regional variants such as `de-AT` are honoured. Anything else falls back to `en`.
      schema:
        type: string
        example: de
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes a retry safe. The first response for a key is stored and replayed for later requests with the
        same key and body. The same key with a different body is rejected with `409` (`idempotency.key-reused`),
        and a retry while the first request is still running with `409` (`idempotency.in-progress`).
        Declared on the POST operations that create something; the other POSTs are naturally idempotent.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
        example: 6b0a3f6e-91c4-4f3a-8d2b-0c1f5e7a9d44
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        ETag of the version the change is based on, taken from the `ETag` header of an earlier read or write.
        When it no longer matches, nothing is changed and the response is `409` (`request.version-conflict`).
        Without the header the write is unconditional.
      schema:
        type: string
        example: '"3"'
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size, at most 100. Larger values are rejected (`pagination.size-too-large`).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    ETag:
      description: Version of the resource, a quoted integer such as `"3"`. Send it back in `If-Match`.
      schema:
        type: string
        example: '"3"'
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  schemas:
    UserId:
      type: string
      format: uuid
      description: User id, equal to the Keycloak `sub` claim.
      example: 3f2b8c1e-6a54-4c1d-9d0b-5f8d2a7e9c10
    AssetId:
      type: string
      pattern: '^ast_[0-9A-HJKMNP-TV-Z]{26}$'
      description: Media asset id, `ast_` followed by a ULID.
      example: ast_01HXZ3Q8K5N2V7B9C4D6F8G0JM
    WallpaperId:
      type: string
      pattern: '^wp_[0-9A-HJKMNP-TV-Z]{26}$'
      description: Wallpaper id, `wp_` followed by a ULID.
      example: wp_01HXZ3R2M7P4T9W1E5Y8A0C3DF
    CollectionId:
      type: string
      pattern: '^col_[0-9A-HJKMNP-TV-Z]{26}$'
      description: Collection id, `col_` followed by a ULID.
      example: col_01HXZ3S5N8Q1V4Z7B0D3G6J9KM
    NotificationId:
      type: string
      pattern: '^ntf_[0-9A-HJKMNP-TV-Z]{26}$'
      description: Notification id, `ntf_` followed by a ULID.
      example: ntf_01HXZ3T7P2R5X8A1C4E7G0H3JK
    Locale:
      type: string
      enum: [en, de, es]
      description: Supported languages (the bundles in `contracts/i18n`).
      example: en

    FieldError:
      type: object
      description: One invalid field of a request.
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Name of the offending body property or query parameter (`a.b` for nested ones).
          example: title
        code:
          type: string
          enum: [NotNull, NotBlank, Size, MaxLength, Min, Max, Pattern, Email, MaxItems, OneOf, PasswordPolicy]
          description: |
            Machine-readable rule. Each value has a message in `contracts/i18n` under `validation.<code>`.
          example: NotBlank
        message:
          type: string
          description: Localized text, for example "Title must not be blank.".
          example: Title must not be blank.
    Problem:
      type: object
      description: |
        RFC 9457 problem details, served as `application/problem+json`. `title`, `detail` and
        `errors[].message` are localized with `Accept-Language`. `traceId`, `code`, `errors` and `requestId`
        are extension members.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            Problem type. For the nine exception classes of README 5.3 this is
            `https://wallpaperhub.dev/problems/<slug>`; the slugs are the `problem.<slug>.*` keys in `contracts/i18n`.
          example: https://wallpaperhub.dev/problems/validation-failed
        title:
          type: string
          description: Short localized summary, the same for every occurrence of the type.
          example: Validation failed
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code.
          example: 400
        detail:
          type: string
          description: Localized explanation of this occurrence.
          example: One or more fields are invalid.
        instance:
          type: string
          description: Path of the request.
          example: /api/v1/wallpapers
        traceId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: |
            W3C trace id of the request, to find it in Tempo and Loki. Always present in errors of the services.
            Errors generated by the gateway itself (401 without a valid token, 404 no route, 413, 429, 502-504) leave it
            out, because Envoy cannot expose the trace id in local replies; they carry `requestId` instead, which is
            also a tag on the gateway's span.
          example: 4bf92f3577b34da6a3ce929d0e0e4736
        code:
          type: string
          pattern: '^[a-z]+(\.[a-z0-9-]+)+$'
          description: |
            Stable domain error code such as `media.asset-not-owned`. `detail` is the localized
            `error.<code>` message. Absent for plain validation errors and for generic failures.
          example: user.username-taken
        requestId:
          type: string
          description: Value of `X-Request-Id`. Only the gateway adds it.
        errors:
          type: array
          description: Field-level details, present for `validation-failed`.
          items:
            $ref: '#/components/schemas/FieldError'
    PageMeta:
      type: object
      description: |
        Pagination fields of every offset-paged list (README 5.2). The concrete page schemas add `items`.
        Requests use `?page=0&size=20&sort=createdAt,desc`; the allowed `sort` values are listed per endpoint.
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
          description: Zero-based index of this page.
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Page size that was used.
          example: 20
        totalItems:
          type: integer
          format: int64
          minimum: 0
          description: Number of items over all pages.
          example: 134
        totalPages:
          type: integer
          minimum: 0
          description: Number of pages.
          example: 7

  responses:
    BadRequest:
      description: |
        The request is invalid (`validation-failed`). Field problems are listed in `errors`; invalid
        pagination or search parameters use the domain codes `pagination.*` and `search.*` instead.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/validation-failed
            title: Validation failed
            status: 400
            detail: One or more fields are invalid.
            instance: /api/v1/wallpapers
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              - field: title
                code: NotBlank
                message: Title must not be blank.
    Unauthorized:
      description: The access token is missing, invalid or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: A valid access token is required.
            instance: /api/v1/users/me
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: The token is valid but the caller may not do this (missing role, or not the owner).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/forbidden
            title: Forbidden
            status: 403
            detail: Only the author or a moderator can change this wallpaper.
            instance: /api/v1/wallpapers/wp_01HXZ3R2M7P4T9W1E5Y8A0C3DF
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            code: wallpaper.not-owner
    NotFound:
      description: The resource does not exist, or the caller may not know that it exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/not-found
            title: Not found
            status: 404
            detail: Wallpaper not found.
            instance: /api/v1/wallpapers/wp_01HXZ3R2M7P4T9W1E5Y8A0C3DF
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            code: wallpaper.not-found
    Conflict:
      description: The request conflicts with the current state of the resource (for example a taken username or a stale `If-Match`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/conflict
            title: Conflict
            status: 409
            detail: The username alice is already taken.
            instance: /api/v1/registrations
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            code: user.username-taken
    PayloadTooLarge:
      description: The request body exceeds the allowed size.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/payload-too-large
            title: Payload too large
            status: 413
            detail: The file is larger than the allowed 30 MB.
            instance: /api/v1/media
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            code: media.file-too-large
    UnsupportedMedia:
      description: The file type is not supported (decided from the file content, never from its extension or `Content-Type`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/unsupported-media
            title: Unsupported media type
            status: 415
            detail: 'This file type is not supported. Allowed types: image/jpeg, image/png, image/webp, image/avif.'
            instance: /api/v1/media
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            code: media.unsupported-type
    RateLimited:
      description: Rate limit exceeded. Wait the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/rate-limited
            title: Too many requests
            status: 429
            detail: Rate limit exceeded. Retry after the number of seconds in the Retry-After header.
            instance: /api/v1/registrations
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/internal-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred.
            instance: /api/v1/users/me
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    UpstreamUnavailable:
      description: A service this request depends on is unavailable or timed out, and no fallback applies.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://wallpaperhub.dev/problems/upstream-unavailable
            title: Upstream unavailable
            status: 503
            detail: The media service is currently unavailable.
            instance: /api/v1/wallpapers
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            code: upstream.unavailable
